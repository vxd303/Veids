# Tên của workflow
name: Build and Test SsagePass on Dev Branch

# Các sự kiện kích hoạt workflow
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build_and_test:
    # Sử dụng máy ảo Ubuntu 22.04
    runs-on: ubuntu-22.04

    steps:
      # Bước 1: Checkout mã nguồn từ nhánh 'dev'
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: 'dev'

      # Bước 2: Cài đặt các gói phụ thuộc cần thiết
      - name: Install dependencies for LLVM build
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-14 lld-14 libclang-14-dev liblld-14-dev cmake

      # Bước 3: Cấu hình CMake để sử dụng chuẩn C++20
      - name: Configure for C++20 Standard in CMake
        run: |
          set -euxo pipefail
          D="Obfuscation"
          if grep -qE 'CMAKE_CXX_STANDARD' "$D/CMakeLists.txt"; then
            sed -i -E 's/CMAKE_CXX_STANDARD[[:space:]]+[0-9]+/CMAKE_CXX_STANDARD 20/' "$D/CMakeLists.txt"
          else
            printf '\nset(CMAKE_CXX_STANDARD 20)\n' >> "$D/CMakeLists.txt"
          fi
          echo "CMakeLists.txt configured to use C++20."
      - name: Patch BogusControlFlow for LLVM14
        run: |
          F="Obfuscation/src/BogusControlFlow.cpp"
          if [ -f "$F" ]; then
            sed -i 's/new ICmpInst([^,]\+, \(.*\), \(.*\), \(.*\), \(.*\))/new ICmpInst(\&*\1, \2, \3, \4)/' "$F" || true
          fi

      - name: Fix StringRef starts_with/ends_with & RANDOM macro
        run: |
          set -euxo pipefail
          # RANDOM macro
          sed -i 's/cryptoutils->get_uint8_t() % 100 < \(.*\)/((uint32_t)cryptoutils->get_uint8_t() % 100u) < (uint32_t)\1/' include/MBAObfuscation.h || true
          # ensure compat macros exist in HikariStringEncryption.cpp
          F=Obfuscation/src/HikariStringEncryption.cpp
          grep -q 'STRREF_STARTS_WITH' "$F" || \
            sed -i '1i #include "llvm/Config/llvm-config.h"\n#if LLVM_VERSION_MAJOR >= 18\n#define STRREF_STARTS_WITH(S,P) (S.starts_with(P))\n#define STRREF_ENDS_WITH(S,P) (S.ends_with(P))\n#else\n#define STRREF_STARTS_WITH(S,P) (S.startswith(P))\n#define STRREF_ENDS_WITH(S,P) (S.endswith(P))\n#endif\n' "$F"
          # Convert any lingering .starts_with/.ends_with usages to macros (optional sweep)
          perl -0777 -pe 's/([A-Za-z0-9_>\)\]]+)\.starts_with\(/STRREF_STARTS_WITH($1, /g' -i src/*.cpp || true
          perl -0777 -pe 's/([A-Za-z0-9_>\)\]]+)\.ends_with\(/STRREF_ENDS_WITH($1, /g' -i src/*.cpp || true
          
      - name: Normalize StringRef starts_with/ends_with
        run: |
          set -euxo pipefail
          F="Obfuscation/src/HikariStringEncryption.cpp"
          # Ensure compat macros present
          grep -q 'STRREF_STARTS_WITH' "$F" || sed -i '1i #include <llvm/ADT/StringRef.h>\n#include <llvm/Config/llvm-config.h>\n#if LLVM_VERSION_MAJOR >= 18\n#define STRREF_STARTS_WITH(S,P) ((S).starts_with(P))\n#define STRREF_ENDS_WITH(S,P) ((S).ends_with(P))\n#else\n#define STRREF_STARTS_WITH(S,P) ((S).startswith(P))\n#define STRREF_ENDS_WITH(S,P) ((S).endswith(P))\n#endif\n' "$F"
          # Convert lingering direct calls in this file
          perl -0777 -pe 's/(\b[A-Za-z0-9_>\)\]]+)\.starts_with\(/STRREF_STARTS_WITH($1, /g' -i "$F" || true
          perl -0777 -pe 's/(\b[A-Za-z0-9_>\)\]]+)\.ends_with\(/STRREF_ENDS_WITH($1, /g' -i "$F" || true

      # Bước 4: Vá lỗi mã nguồn để tương thích với LLVM 14
      - name: Patch sources for LLVM 14
        run: |
          set -euxo pipefail
          D="Obfuscation"
          mapfile -t OPT_FILES < <(grep -RIl --include='*.{cpp,h}' -e 'std::optional' -e 'std::nullopt' "$D" || true)
          for f in "${OPT_FILES[@]}"; do
            grep -qE '^[[:space:]]*#include <optional>' "$f" || sed -i '1i #include <optional>' "$f"
          done
          if [ -f "$D/src/Utils.cpp" ]; then
            perl -0777 -pe 's/DemotePHIToStack\s*\(\s*PN\s*,\s*insertPoint\s*\)/DemotePHIToStack(PN, insertPoint ? \&\*insertPoint.value() : nullptr)/g' -i "$D/src/Utils.cpp" || true
            perl -0777 -pe 's/DemoteRegToStack\s*\(\s*\*I\s*,\s*false\s*,\s*insertPoint\s*\)/DemoteRegToStack(*I, false, insertPoint ? \&\*insertPoint.value() : nullptr)/g' -i "$D/src/Utils.cpp" || true
          fi
          if [ -f "$D/src/VMFlatten.cpp" ]; then
            perl -0777 -pe 's/DemotePHIToStack\s*\(\s*([^\),]+)\s*,\s*insertionPoint\s*\)/DemotePHIToStack(\1, \&*insertionPoint)/g' -i "$D/src/VMFlatten.cpp" || true
            perl -0777 -pe 's/DemoteRegToStack\s*\(\s*([^\),]+)\s*,\s*false\s*,\s*insertionPoint\s*\)/DemoteRegToStack(\1, false, \&*insertionPoint)/g' -i "$D/src/VMFlatten.cpp" || true
          fi

      # !! BƯỚC MỚI ĐƯỢC THÊM VÀO ĐÂY !!
      # Vá lỗi tên phương thức của llvm::StringRef trong Utils.cpp
      - name: Fix llvm::StringRef method in Utils.cpp
        run: |
          set -euxo pipefail
          F="Obfuscation/src/Utils.cpp"
          if [ -f "$F" ]; then
            echo "Patching .starts_with -> .startswith in $F"
            sed -i 's/\.starts_with(/.startswith(/g' "$F"
          fi
      - name: Fix llvm::StringRef method in FunctionWrapper.cpp
        run: |
          set -euxo pipefail
          F="Obfuscation/src/FunctionWrapper.cpp"
          if [ -f "$F" ]; then
            echo "Patching .starts_with -> .startswith in $F"
            sed -i 's/\.starts_with(/.startswith(/g' "$F"
          fi

      # Bước 5: Vá lỗi cho IPObfuscationContext.cpp
      - name: Fix IPObfuscationContext for LLVM14
        run: |
          set -euxo pipefail
          D="Obfuscation"
          F="$D/src/IPObfuscationContext.cpp"
          if [ -f "$F" ]; then
            sed -i 's/NF->splice(NF->begin(), F);/NF->getBasicBlockList().splice(NF->begin(), F.getBasicBlockList());/' "$F"
            perl -0777 -pe 's/([A-Za-z_]\w*)->splice\(\s*\1->begin\(\)\s*,\s*([A-Za-z_]\w*)\s*\);/\1->getBasicBlockList().splice(\1->begin(), \2.getBasicBlockList());/g' -i "$F"
            sed -i -E 's/([A-Za-z_]\w*)\.getBasicBlockList\(\)/\1->getBasicBlockList()/g' "$F"
            perl -0777 -pe 's/([A-Za-z_]\w*)->getBasicBlockList\(\)\.splice\(\s*\1->begin\(\)\s*,/\1->getBasicBlockList().splice(\1->getBasicBlockList().begin(),/g' -i "$F"
            sed -i 's/NF->getBasicBlockList().splice(NF->begin(), F.getBasicBlockList());/NF->getBasicBlockList().splice(NF->getBasicBlockList().begin(), F->getBasicBlockList());/' "$F" || true
          fi

      # Bước 6: Vá lỗi cho LegacyLowerSwitch.cpp
      - name: Fix LegacyLowerSwitch for LLVM14
        run: |
          set -euxo pipefail
          D="Obfuscation"
          if [ -f "$D/src/LegacyLowerSwitch.cpp" ]; then
            sed -i 's/getFirstNonPHI()/getFirstNonPHI()->getIterator()/g' "$D/src/LegacyLowerSwitch.cpp"
          fi

      # Bước 7: Vá lỗi cho IndirectBranch.cpp
      - name: Clean IndirectBranch accidental getIterator() on map iters
        run: |
          set -euxo pipefail
          D="Obfuscation"
          [ -f "$D/src/IndirectBranch.cpp" ] && sed -i 's/->getIterator()//g' "$D/src/IndirectBranch.cpp" || true

      # Bước 8: Cấu hình và biên dịch dự án
      - name: Configure and build
        run: |
          mkdir build
          cd build
          cmake -DLLVM_DIR=/usr/lib/llvm-14/cmake -DLT_LLVM_INSTALL_DIR=/usr/lib/llvm-14 ../Obfuscation
          make

      # Bước 9: Tìm file plugin .so đã được build
      - name: Locate plugin
        id: find_plugin
        run: |
          set -e
          f=$(find build -type f -name "*SsageObfuscator*.so" -o -name "SsageObfuscator.so" | head -n1 || true)
          test -n "$f" || { echo "::error::plugin .so not found"; find build -maxdepth 3 -type f -printf '%p\n'; exit 1; }
          echo "plugin=$f" >> "$GITHUB_OUTPUT"
          ls -l "$f" && file "$f"

      # Bước 10: Cài đặt Android NDK r25c
      - name: Setup NDK r25c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      # Bước 11: Kiểm tra biên dịch với NDK và plugin
      - name: NDK compile test (load plugin at compile time)
        run: |
          set -euxo pipefail
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          "$CXX" --version
          PLUGIN="${{ steps.find_plugin.outputs.plugin }}"
          cat > ndk_test.cpp <<'EOF'
          #include <cstdio>
          __attribute((__annotate__(("fla split strenc"))))
          static void f(){ std::puts("NDK compile OK"); }
          int main(){ f(); return 0; }
          EOF
          "$CXX" --target=aarch64-linux-android31 -O2 -fPIC \
            -fpass-plugin="$PLUGIN" \
            -c ndk_test.cpp -o ndk_test.o
          "$CXX" --target=aarch64-linux-android31 ndk_test.o -shared -o libndk_test.so
          file libndk_test.so || true

      # Bước 12: Tải lên các artifacts đã build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssagepass-ndk-artifacts
          path: |
            ${{ steps.find_plugin.outputs.plugin }}
            libndk_test.so
            ndk_test.cpp
            ndk_test.o
