name: Build and Test SsagePass on Dev Branch

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build_and_test:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: 'dev'

      - name: Install dependencies for LLVM build
        run: |
          sudo apt-get update
          sudo apt-get install -y lsb-release wget software-properties-common gnupg
          
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/llvm-org.gpg
          echo "deb [signed-by=/etc/apt/keyrings/llvm-org.gpg] http://apt.llvm.org/focal/ llvm-toolchain-focal-11 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          
          sudo apt-get update
          sudo apt-get install -y clang-11 lld-11 libclang-11-dev liblld-11-dev cmake g++-9

      - name: Patch starts_with to startswith
        run: |
          sed -i 's/\.starts_with/\.startswith/g' Obfuscation/src/Utils.cpp
          sed -i 's/\.starts_with/\.startswith/g' Obfuscation/src/FunctionWrapper.cpp
          
      - name: Configure and build
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_CXX_COMPILER=g++-9 -DLLVM_DIR=/usr/lib/llvm-11/cmake -DLT_LLVM_INSTALL_DIR=/usr/lib/llvm-11 ../Obfuscation
          make

      - name: Locate plugin
        id: find_plugin
        run: |
          set -e
          f=$(find build -type f -name "*SsageObfuscator*.so" -o -name "SsageObfuscator.so" | head -n1 || true)
          test -n "$f" || { echo "::error::plugin .so not found"; find build -maxdepth 3 -type f -printf '%p\n'; exit 1; }
          echo "plugin=$f" >> "$GITHUB_OUTPUT"
          ls -l "$f" && file "$f"

      - name: Setup NDK r25c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: NDK compile test (load plugin at compile time)
        run: |
          set -euxo pipefail
          NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          "$CXX" --version
          PLUGIN="${{ steps.find_plugin.outputs.plugin }}"
          cat > ndk_test.cpp <<'EOF'
          #include <cstdio>
          __attribute((__annotate__(("fla split strenc"))))
          static void f(){ std::puts("NDK compile OK"); }
          int main(){ f(); return 0; }
          EOF
          "$CXX" --target=aarch64-linux-android31 -O2 -fPIC \
            -fpass-plugin="$PLUGIN" \
            -c ndk_test.cpp -o ndk_test.o
          "$CXX" --target=aarch64-linux-android31 ndk_test.o -shared -o libndk_test.so
          file libndk_test.so || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssagepass-ndk-artifacts
          path: |
            ${{ steps.find_plugin.outputs.plugin }}
            libndk_test.so
            ndk_test.cpp
            ndk_test.o
